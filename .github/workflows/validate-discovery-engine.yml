name: Validate Discovery Engine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Discovery Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Verify required files and directories
        run: |
          REQUIRED_PATHS=(
            "discovery_engine"
            "Scrape_data/cleaned"
            "discovery_engine/app.py"
            "discovery_engine/data_loader.py"
            "requirements.txt"
          )

          missing=0
          for item in "${REQUIRED_PATHS[@]}"; do
            if [ ! -e "$item" ]; then
              echo "::error::Required path missing: $item"
              missing=$((missing + 1))
            else
              echo "✓ Found: $item"
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "::error::Validation failed: $missing required file(s)/directory(ies) are missing!"
            exit 1
          fi
          echo "All required files and directories exist."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Discovery Engine modules and imports
        run: |
          python -m py_compile discovery_engine/app.py discovery_engine/data_loader.py discovery_engine/pattern_analysis.py
          python -c "
          import sys
          sys.path.insert(0, '.')
          import discovery_engine
          from discovery_engine import data_loader, pattern_analysis
          print('✓ Discovery Engine modules imported successfully without starting Streamlit server.')
          status = data_loader.check_data_files()
          for key, info in status.items():
              print(f'  - Dataset [{key}]: exists={info.get(\"exists\")}, size={info.get(\"size_bytes\")} bytes')
          "
